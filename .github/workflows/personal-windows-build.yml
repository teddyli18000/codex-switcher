name: Personal Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Check changed Rust formatting
        shell: pwsh
        run: |
          $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $base = if ($event.before -and $event.before -notmatch '^0+$') { $event.before } else { 'HEAD^' }
          $files = @(git diff --name-only --diff-filter=ACMR $base HEAD -- 'src-tauri/**/*.rs')
          if ($files.Count -gt 0) {
            rustfmt --edition 2021 --check --config skip_children=true @files
            if ($LASTEXITCODE -ne 0) { throw 'Changed Rust files need formatting.' }
          }
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build installer from committed source
        run: pnpm tauri:win build --bundles nsis
      - name: Record source and installer checksum
        shell: pwsh
        run: |
          $out = 'personal-windows'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe -Destination $out
          @(
            "Source commit: $env:GITHUB_SHA"
            'Usage: explicit manual refresh; persistent cache; five-minute TTL'
            'Warm-up: manual and application-owned daily schedule'
            'Updater and telemetry reporting: absent'
          ) | Set-Content "$out/BUILD-MANIFEST.txt"
          Get-ChildItem $out -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content "$out/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-switcher-personal-windows
          path: personal-windows/*
          if-no-files-found: error
          retention-days: 30
